[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-adk-learning-lab"
version = "0.2.0"
description = "A hands-on learning project for building and evaluating agents with Google ADK."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Personal ADK Learner"}]
dependencies = ["google-adk[eval]>=2.13.0,<3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["learning_coach*", "course_assistant*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "req(id): tag a test with the requirement id it covers, e.g. req('FR-04')",
    "live: test needs network / a real model call; excluded from the offline suite (NFR-02)",
]
